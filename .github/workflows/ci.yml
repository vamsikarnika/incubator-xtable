name: Java CI

on: [ push ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main') }}

permissions:
  id-token: write
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check-changelog.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Check changed files
        id: check-changelog
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "CHANGED_FILES: $CHANGED_FILES"
          if [[ "$CHANGED_FILES" == "CHANGELOG" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "skipping build as only CHANGELOG is changed"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check-changes
    # Job-level condition to skip when only CHANGELOG is changed
    if: ${{ needs.check-changes.outputs.skip != 'true' }}

    steps:
      - name: Checkout self
        uses: actions/checkout@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::194159489498:role/GithubActionsPublishHudi-RepositoryPublisherRole-10H7ABJVFNSQ9
          role-session-name: HudiPublishSession
          role-duration-seconds: 900
      - name: Set Env
        run: echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain onehouse --domain-owner 194159489498 --query authorizationToken --output text)" >> $GITHUB_ENV
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven
          server-id: codeartifact
          server-username: AWS
          server-password: CODEARTIFACT_AUTH_TOKEN
      - name: Build with Maven
        run: mvn -B -ntp clean install -T 2